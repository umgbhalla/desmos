[package]
name = "xai-ratatui-inline"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Grok-build inline viewport (native scrollback + pinned live region)"

[dependencies]
anstyle-parse = "0.2"
crossterm = "0.28"
ratatui = { version = "0.29", features = ["crossterm"] }
unicode-width = "0.2"

[features]
scrolling-regions = ["ratatui/scrolling-regions"]
