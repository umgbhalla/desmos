[package]
name = "desmos-tui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Three-pane desmos TUI hosting grok-build scrollback"

# The fuzzy file picker (src/fuzzy.rs) is the one lane that leans on fff-search.
# It is `optional` so the whole TUI still builds when the vendored engine is
# blocked — without the feature the picker degrades to a one-line notice and the
# files pane's own read_dir browser stays the way to open a file. That is the
# real "degrades to read_dir, never a second fuzzy implementation" contract, not
# a build we let fail. Source stays `workspace = true`; only the compile is opt.
[features]
default = ["fuzzy"]
fuzzy = ["dep:fff-search"]

[dependencies]
crossterm = { workspace = true }
ratatui = { workspace = true, features = ["crossterm"] }
serde_json = { workspace = true }
toml = { workspace = true }
unicode-width = { workspace = true }
fff-search = { workspace = true, optional = true }
xai-grok-config = { path = "../../vendor/grok-build/crates/codegen/xai-grok-config" }
xai-grok-pager = { path = "../../vendor/grok-build/crates/codegen/xai-grok-pager" }
xai-grok-pager-diff = { path = "../../vendor/grok-build/crates/codegen/xai-grok-pager-diff" }

[dev-dependencies]
# `set_protocol_for_test` — the inline-image tests have to force a graphics
# protocol, since a test binary has no terminal to detect one from.
xai-grok-pager = { path = "../../vendor/grok-build/crates/codegen/xai-grok-pager", features = ["test-support"] }
