[package]
name = "desmos-tui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Grok-minimal TUI over the desmos kernel"

[dependencies]
crossterm = "0.28"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde_json = "1"
