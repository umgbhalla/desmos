[project]
name = "desmos"
version = "0.1.1b1"
description = "A coding agent that rebuilds its own harness: writable syscalls, live reload, reversible generations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
kernel = ["ipython>=8", "ipykernel"]
spine = ["websockets>=12"]

[project.scripts]
desmos = "desmos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["inverted"]

[tool.setuptools.packages.find]
include = ["desmos*"]

[tool.setuptools.package-data]
desmos = ["skills/**/*", "front/desk_static/**/*"]
