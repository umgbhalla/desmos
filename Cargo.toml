# Ship profile for `python -m desmos tui`. Strip only — LTO and
# codegen-units=1 across the whole pager graph cost tens of minutes of link
# time for a TUI that is already idle at 0% CPU.
# ponytail: no LTO, turn it on if frame time ever shows up in a profile.
[profile.release]
strip = "symbols"
[workspace.lints.clippy]
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
needless_lifetimes = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
uninlined_format_args = "allow"
useless_format = "allow"

