# Workspace deps are grok-build's table (paths rewritten to vendor/) so
# desmos-tui can host ScrollbackPane without forking pager Cargo.toml.
# vendor/grok-build is a pinned git submodule. Initialize its committed gitlink
# before a source build; every checked-out grok crate is then a member of this
# workspace. That membership is what decides local ownership -- a
# vendored crate whose consumers all say `{ workspace = true }` can be
# redirected into crates/ by the table below (xai-grok-markdown), while one
# reached by a hard path = "../.." cannot.

[patch.crates-io]
async-openai = { git = "https://github.com/our-forks/async-openai.git", rev = "95b52ebdedf42143083cf3d6f0e0be7c84e9c808" }

[workspace]
resolver = "2"
members = [
    "crates/desmos-events",
    "crates/desmos-tui",
    "crates/xai-grok-markdown",
    "crates/xai-grok-markdown-core",
]
# vendor/fff keeps its OWN [workspace]; exclude it so this workspace does not
# try to absorb fff-core as a member. It is reached only via the fff-search
# path dep below, which resolves against fff's nested workspace table
# (git2 vendored-libgit2, zlob never enabled).
exclude = ["vendor/fff"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

