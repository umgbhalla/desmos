name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tui:
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          rustflags: ""
          cache-key: ${{ matrix.target }}
      - name: Install protoc
        run: |
          if ! command -v protoc >/dev/null; then
            if [ "$RUNNER_OS" = macOS ]; then
              brew install protobuf
            else
              sudo apt-get update
              sudo apt-get install -y protobuf-compiler
            fi
          fi
      - name: Build TUI
        run: cargo build --locked -p desmos-tui --release --target "${{ matrix.target }}"
      - name: Test TUI
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          env -u NO_COLOR COLORTERM=truecolor TERM=xterm-256color cargo test --locked -p desmos-tui
          cargo test --locked -p xai-grok-markdown -p xai-grok-markdown-core
      - name: Package TUI
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/package
          cp "target/$TARGET/release/desmos-tui" dist/package/desmos-tui
          tar -C dist/package -czf "dist/desmos-tui-$TARGET.tar.gz" desmos-tui
          cd dist
          shasum -a 256 "desmos-tui-$TARGET.tar.gz" > "desmos-tui-$TARGET.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.target }}
          path: dist/desmos-tui-*

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
          python -m desmos check
          python -m unittest discover -s tests -q
          python inverted.py --check
          python -m pip wheel --no-deps . -w dist
          cd dist
          shasum -a 256 desmos-*.whl > "desmos-$version-py3-none-any.whl.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist/*
      - name: Check documentation links
        run: |
          python - <<'PY'
          import pathlib
          import re

          bad = []
          root = pathlib.Path(".")
          for md in [*root.glob("*.md"), *root.glob("docs/*.md"), *root.glob(".github/**/*.md")]:
              for text, link in re.findall(r"\[([^\]]*)\]\(([^)]+)\)", md.read_text()):
                  if link.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  target = (md.parent / link.split("#")[0]).resolve()
                  if not target.exists():
                      bad.append(f"{md}: [{text}]({link})")
          if bad:
              raise SystemExit("\n".join(bad))
          PY
      - name: Check for secrets
        run: |
          rc=0
          git grep -InE --untracked \
            'sk-ant-[A-Za-z0-9_-]{16,}|sk-proj-[A-Za-z0-9_-]{16,}|(ANTHROPIC|OPENAI|XAI)_API_KEY=[A-Za-z0-9_-]{16,}|(access|refresh|id)_token"?[[:space:]:=]+"?eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{16,}' \
            -- . || rc=$?
          case "$rc" in
            0) echo "possible secret in tree" >&2; exit 1 ;;
            1) echo "no key material found" ;;
            *) echo "git grep failed (rc=$rc)" >&2; exit 1 ;;
          esac

  release:
    needs: [tui, python]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --prerelease --title "$GITHUB_REF_NAME beta"
