name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: self-check
        run: python3 inverted.py --check
      - name: no secrets
        run: |
          if grep -RInE 'sk-ant-|ANTHROPIC_API_KEY=.+' --exclude=.env.example --exclude-dir=.git .; then
            echo "possible secret in tree" >&2
            exit 1
          fi
          echo "no key material found"
