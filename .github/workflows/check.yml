name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: self-check
        run: python3 -m desmos check
      - name: unit tests
        run: python3 -m unittest discover -s tests -q
      - name: back-compat entry
        run: python3 inverted.py --check
      - name: docs links resolve
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(".")
          bad = []
          for md in [*root.glob("*.md"), *root.glob("docs/*.md"), *root.glob(".github/**/*.md")]:
              for text, link in re.findall(r"\[([^\]]*)\]\(([^)]+)\)", md.read_text()):
                  if link.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  target = (md.parent / link.split("#")[0]).resolve()
                  if not target.exists():
                      bad.append(f"{md}: [{text}]({link})")
          if bad:
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          print("all relative links resolve")
          PY
      - name: no secrets
        # Key-shaped material only: a 16-char floor no placeholder or "$VAR"
        # clears, so the whole tree is in scope with no pathspec exclusions --
        # including vendor/ (3231 committed files, our DESMOS_ACP branch among
        # them) and this workflow itself. Shapes: Anthropic sk-ant, OpenAI
        # sk-proj, an =-assigned provider key, and a JWT anchored to the token
        # field that carries it (the OpenAI/Codex OAuth flow in desmos/auth.py).
        # A bare JWT shape is not usable here: four vendored sanitizer/auth
        # tests carry example tokens. rc: 0 is a hit, 1 is clean, anything else
        # is git failing and must not read as clean.
        run: |
          rc=0
          git grep -InE --untracked \
            'sk-ant-[A-Za-z0-9_-]{16,}|sk-proj-[A-Za-z0-9_-]{16,}|(ANTHROPIC|OPENAI|XAI)_API_KEY=[A-Za-z0-9_-]{16,}|(access|refresh|id)_token"?[[:space:]:=]+"?eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{16,}' \
            -- . || rc=$?
          case "$rc" in
            0) echo "possible secret in tree" >&2; exit 1 ;;
            1) echo "no key material found" ;;
            *) echo "git grep failed (rc=$rc)" >&2; exit 1 ;;
          esac

  # Two rust jobs, never --workspace: every vendored grok crate is a member of
  # this workspace (89 packages), so --workspace would build the whole pager
  # graph to run the markdown tests.
  md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: markdown tests
        run: cargo test -p xai-grok-markdown -p xai-grok-markdown-core

  tui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      # desmos-tui pulls the pager graph, whose build scripts need a proto
      # compiler. scripts/protoc (forced by .cargo/config.toml) falls back to
      # PATH, so installing the package is enough.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: tui tests
        run: cargo test -p desmos-tui
